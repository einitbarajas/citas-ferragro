# Render Blueprint: PostgreSQL + API FastAPI.
# Tras el primer despliegue, define CORS_ORIGINS con la URL HTTPS de Vercel.
databases:
  - name: ferragro-db
    databaseName: ferragro
    user: ferragro
    plan: free

services:
  - type: web
    name: ferragro-api
    runtime: python
    plan: free
    repo: https://github.com/einitbarajas/citas-ferragro
    branch: main
    autoDeploy: true
    rootDir: backend
    # No ejecutar scripts de BD en build (si fallan, Render no publica). El arranque corrige el Admin.
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ferragro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Correo (recuperar contraseña, bienvenida, citas). Outlook: smtp.office365.com:587
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Ferragro
      - key: SMTP_USE_TLS
        value: "true"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: PYTHON_VERSION
        value: 3.12.8
