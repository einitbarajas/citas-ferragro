# Sincroniza SMTP de GitHub Secrets → Render y verifica smtp_login_ok.
# Secrets: RENDER_API_KEY, SMTP_HOST, SMTP_USER, SMTP_PASSWORD, SMTP_FROM_EMAIL
name: Sync SMTP production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/services/email_dispatch.py"
      - "backend/app/services/mailer.py"
      - "backend/app/services/smtp_resolver.py"
      - "backend/app/core/config.py"
      - "backend/app/main.py"
      - ".github/workflows/sync-smtp-production.yml"
      - ".github/workflows/deploy-render-api.yml"

jobs:
  sync:
    if: ${{ secrets.RENDER_API_KEY != '' && secrets.SMTP_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync SMTP env + secret file to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        run: |
          set -euo pipefail
          SERVICE_ID="srv-d82dvanaqgkc739362u0"
          HOST="${SMTP_HOST:-smtp.gmail.com}"
          USER="${SMTP_USER}"
          FROM="${SMTP_FROM_EMAIL:-$USER}"
          PASS="$(echo "$SMTP_PASSWORD" | tr -d '[:space:]')"
          for pair in \
            "SMTP_PROFILE=gmail" \
            "SMTP_HOST=${HOST}" \
            "SMTP_PORT=587" \
            "SMTP_USER=${USER}" \
            "SMTP_PASSWORD=${PASS}" \
            "SMTP_FROM_EMAIL=${FROM}" \
            "SMTP_FROM_NAME=Ferragro" \
            "SMTP_USE_TLS=true" \
            "SMTP_USE_SSL=false"
          do
            KEY="${pair%%=*}"
            VAL="${pair#*=}"
            JSON=$(python3 -c 'import json,sys; print(json.dumps({"key":sys.argv[1],"value":sys.argv[2]}))' "$KEY" "$VAL")
            curl -fsS -X PUT "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/${KEY}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$JSON" >/dev/null
            echo "OK ${KEY}"
          done
          CONTENT=$(printf '%s\n' \
            "SMTP_PROFILE=gmail" "SMTP_HOST=${HOST}" "SMTP_PORT=587" \
            "SMTP_USER=${USER}" "SMTP_PASSWORD=${PASS}" "SMTP_FROM_EMAIL=${FROM}" \
            "SMTP_FROM_NAME=Ferragro" "SMTP_USE_SSL=false" "SMTP_USE_TLS=true")
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"name":"smtp.env","content":sys.argv[1]}))' "$CONTENT")
          curl -fsS -X PUT "https://api.render.com/v1/services/${SERVICE_ID}/secret-files/smtp.env" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo "OK smtp.env"

      - name: Deploy Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          SERVICE_ID="srv-d82dvanaqgkc739362u0"
          if [ -n "${RENDER_API_KEY:-}" ]; then
            curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"clear"}' || true
          fi
          if [ -n "${DEPLOY_HOOK:-}" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK" || true
          fi

      - name: Wait for smtp_login_ok
        run: |
          for i in $(seq 1 30); do
            sleep 20
            BODY=$(curl -fsS --max-time 120 "https://ferragro-api.onrender.com/health/deep" || echo "{}")
            echo "intento $i: $(echo "$BODY" | grep -o '"smtp_login_ok":[^,}]*' | head -1) $(echo "$BODY" | grep -o '"build_id":"[^"]*"' | head -1)"
            echo "$BODY" | grep -q '"smtp_login_ok":true' && exit 0
          done
          exit 1

  remind:
    if: ${{ secrets.RENDER_API_KEY == '' || secrets.SMTP_PASSWORD == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Configura GitHub Secrets (RENDER_API_KEY, SMTP_*) o ejecuta:"
          echo "  .\\scripts\\instalar-smtp-github-secrets.ps1"
          echo "Luego pega smtp-render.env en Render → Secret File smtp.env → Manual Deploy"
