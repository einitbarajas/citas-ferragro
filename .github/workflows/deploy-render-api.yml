# Dispara deploy del API en Render en cada push a main que toque backend o render.yaml.
# Requiere RENDER_DEPLOY_HOOK (Render → ferragro-api → Settings → Deploy Hook).
# Sin el secreto: aviso en Actions; usa Manual Deploy o scripts/desplegar-produccion.ps1
name: Deploy Render API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-render-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read expected build_id
        id: build
        run: |
          BUILD_ID=$(grep -E '^API_BUILD_ID\s*=' backend/app/main.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "expected=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Expected API_BUILD_ID: $BUILD_ID"

      - name: Sync SMTP to Render (if secrets configured)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SMTP_PASSWORD:-}" ]; then
            echo "SMTP secrets no configurados en GitHub; omitiendo sync (usa smtp.env en Render)."
            exit 0
          fi
          SERVICE_ID="srv-d82dvanaqgkc739362u0"
          HOST="${SMTP_HOST:-smtp.gmail.com}"
          USER="${SMTP_USER}"
          FROM="${SMTP_FROM_EMAIL:-$USER}"
          PASS="$(echo "$SMTP_PASSWORD" | tr -d '[:space:]')"
          for pair in \
            "SMTP_PROFILE=gmail" \
            "SMTP_HOST=${HOST}" \
            "SMTP_PORT=587" \
            "SMTP_USER=${USER}" \
            "SMTP_PASSWORD=${PASS}" \
            "SMTP_FROM_EMAIL=${FROM}" \
            "SMTP_FROM_NAME=Ferragro" \
            "SMTP_USE_TLS=true" \
            "SMTP_USE_SSL=false"
          do
            KEY="${pair%%=*}"
            VAL="${pair#*=}"
            JSON=$(python3 -c 'import json,sys; print(json.dumps({"key":sys.argv[1],"value":sys.argv[2]}))' "$KEY" "$VAL")
            curl -fsS -X PUT "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/${KEY}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$JSON" >/dev/null
            echo "OK ${KEY}"
          done
          CONTENT=$(printf '%s\n' \
            "SMTP_PROFILE=gmail" \
            "SMTP_HOST=${HOST}" \
            "SMTP_PORT=587" \
            "SMTP_USER=${USER}" \
            "SMTP_PASSWORD=${PASS}" \
            "SMTP_FROM_EMAIL=${FROM}" \
            "SMTP_FROM_NAME=Ferragro" \
            "SMTP_USE_SSL=false" \
            "SMTP_USE_TLS=true")
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"name":"smtp.env","content":sys.argv[1]}))' "$CONTENT")
          curl -fsS -X PUT "https://api.render.com/v1/services/${SERVICE_ID}/secret-files/smtp.env" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY" && echo "OK smtp.env" || echo "::warning::No se pudo subir smtp.env"

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SERVICE_ID="srv-d82dvanaqgkc739362u0"
          DEPLOYED=0
          if [ -n "${RENDER_API_KEY:-}" ]; then
            HTTP=$(curl -sS -o /tmp/render-deploy.out -w "%{http_code}" \
              -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"clear"}')
            cat /tmp/render-deploy.out || true
            echo "Render API deploy HTTP ${HTTP}"
            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
              DEPLOYED=1
            fi
          fi
          if [ -n "${DEPLOY_HOOK:-}" ]; then
            HTTP_CODE=$(curl -sS -o /tmp/render-hook.out -w "%{http_code}" -X POST "$DEPLOY_HOOK")
            cat /tmp/render-hook.out || true
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              DEPLOYED=1
            fi
            echo "Deploy hook HTTP ${HTTP_CODE}"
          fi
          if [ "$DEPLOYED" -eq 0 ]; then
            echo "::warning::Sin deploy hook ni RENDER_API_KEY. Haz Manual Deploy en Render."
            echo "https://dashboard.render.com/web/srv-d82dvanaqgkc739362u0"
          fi

      - name: Wait for new build on /health
        env:
          EXPECTED: ${{ steps.build.outputs.expected }}
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Sin hook: no se espera build_id nuevo."
            exit 0
          fi
          API="https://ferragro-api.onrender.com/health"
          for i in $(seq 1 24); do
            sleep 20
            BODY=$(curl -fsS --max-time 90 "$API" || echo "{}")
            BUILD_ID=$(echo "$BODY" | grep -o '"build_id":"[^"]*"' | head -1 | cut -d'"' -f4)
            GIT_COMMIT=$(echo "$BODY" | grep -o '"render_git_commit":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "intento $i: build_id=$BUILD_ID render_git_commit=${GIT_COMMIT:-null}"
            if [ "$BUILD_ID" = "$EXPECTED" ]; then
              DEEP=$(curl -fsS --max-time 120 "${API%/health}/health/deep" || echo "{}")
              echo "$DEEP" | grep -o '"smtp_login_ok":[^,}]*' || true
              if echo "$DEEP" | grep -q '"smtp_login_ok":true'; then
                echo "API en producción con build_id=$EXPECTED y smtp_login_ok=true"
                exit 0
              fi
              echo "build_id OK; smtp_login_ok aún no true (revisa smtp.env en Render)"
              exit 0
            fi
          done
          echo "::warning::Tras 8 min el API aún no muestra build_id=$EXPECTED."
          echo "Render → Manual Deploy → https://dashboard.render.com/web/srv-d82dvanaqgkc739362u0"
