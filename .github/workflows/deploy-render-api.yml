# Dispara deploy del API en Render en cada push a main que toque backend o render.yaml.
# Requiere RENDER_DEPLOY_HOOK (Render → ferragro-api → Settings → Deploy Hook).
# Sin el secreto: aviso en Actions; usa Manual Deploy o scripts/desplegar-produccion.ps1
name: Deploy Render API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-render-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read expected build_id
        id: build
        run: |
          BUILD_ID=$(grep -E '^API_BUILD_ID\s*=' backend/app/main.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "expected=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Expected API_BUILD_ID: $BUILD_ID"

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/render-hook.out -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          cat /tmp/render-hook.out || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Deploy Hook respondió HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy solicitado en Render (HTTP $HTTP_CODE)."

      - name: Wait for new build on /health
        env:
          EXPECTED: ${{ steps.build.outputs.expected }}
        run: |
          API="https://ferragro-api.onrender.com/health"
          for i in $(seq 1 24); do
            sleep 20
            BODY=$(curl -fsS --max-time 90 "$API" || echo "{}")
            BUILD_ID=$(echo "$BODY" | grep -o '"build_id":"[^"]*"' | head -1 | cut -d'"' -f4)
            GIT_COMMIT=$(echo "$BODY" | grep -o '"render_git_commit":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "intento $i: build_id=$BUILD_ID render_git_commit=${GIT_COMMIT:-null}"
            if [ "$BUILD_ID" = "$EXPECTED" ]; then
              echo "API en producción con build_id=$EXPECTED"
              exit 0
            fi
          done
          echo "::warning::Tras 8 min el API aún no muestra build_id=$EXPECTED."
          echo "Render → Manual Deploy → https://dashboard.render.com/web/srv-d82dvanaqgkc739362u0"

  remind-hook:
    if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::RENDER_DEPLOY_HOOK no configurado. El push no despliega Render automáticamente."
          echo "Opciones: GitHub Secrets → RENDER_DEPLOY_HOOK, o Render → Manual Deploy, o .\scripts\desplegar-produccion.ps1"
