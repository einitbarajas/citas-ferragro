# Validación en cada push/PR: pruebas API (con y sin BD) y build del frontend.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ferragro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    name: Backend (pytest sin BD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/db_trabajo
      SECRET_KEY: ci-pytest-secret-min-32-chars-required-here
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and API smoke tests
        run: >
          pytest tests/
          --ignore=tests/test_appointment_service_db.py
          --ignore=tests/test_db_crud_functions.py
          --ignore=tests/test_franjas_per_team_logic.py
          --ignore=tests/test_unload_team_resolve.py
          --ignore=tests/test_unload_team_names.py
          -q --tb=short

  backend-db-tests:
    name: Backend (pytest con PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_trabajo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_trabajo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/db_trabajo
      SECRET_KEY: ci-pytest-secret-min-32-chars-required-here
      RATE_LIMIT_ENABLED: "false"
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: db_trabajo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Prepare database (init + CRUD + fixtures)
        run: chmod +x db/ci-prepare-database.sh && db/ci-prepare-database.sh

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database integration tests
        run: >
          pytest tests/test_appointment_service_db.py
          tests/test_db_crud_functions.py
          tests/test_franjas_per_team_logic.py
          tests/test_unload_team_resolve.py
          tests/test_unload_team_names.py
          -q --tb=short

  frontend-build:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://ferragro-api.onrender.com
        run: npm run build
