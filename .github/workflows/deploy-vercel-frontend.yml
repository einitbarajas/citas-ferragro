# Despliega el frontend en Vercel en cada push a main (carpeta frontend/).
# Requiere secreto VERCEL_TOKEN en GitHub (Settings → Secrets → Actions).
# IDs del proyecto (no son secretos): ver frontend/.vercel/project.json.example
name: Deploy Vercel Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/deploy-vercel-frontend.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_wIdcG8ilSknuM7IteHRO3Uce
  VERCEL_PROJECT_ID: prj_SPlAUoXMgvBqX7QNAgOtqo0dygVm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN en GitHub Actions."
            echo "Crea un token en https://vercel.com/account/tokens"
            echo "Repo → Settings → Secrets → Actions → VERCEL_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Deploy to Vercel Production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@54.4.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Production URL
        run: echo "Frontend → https://frontend-ferragro.vercel.app"
