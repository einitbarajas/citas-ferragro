# Despliega el frontend en Vercel en cada push a main (carpeta frontend/).
# Requiere VERCEL_TOKEN, o conecta el repo en vercel.com (Settings → Git).
name: Deploy Vercel Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/deploy-vercel-frontend.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_wIdcG8ilSknuM7IteHRO3Uce
  VERCEL_PROJECT_ID: prj_SPlAUoXMgvBqX7QNAgOtqo0dygVm

jobs:
  deploy:
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Deploy to Vercel Production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@54.4.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Production URL
        run: echo "Frontend → https://frontend-ferragro.vercel.app"

  remind-token:
    if: ${{ secrets.VERCEL_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::VERCEL_TOKEN no configurado. Conecta Git en Vercel o añade el secreto."
          echo "Panel: https://vercel.com/ferragro/frontend → Deployments → Redeploy"
